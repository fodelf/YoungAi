# pipeline.conf — end-to-end vertical-model factory configuration.
# Everything numeric is tunable; 驱动脚本 e2e_build.sh 已删(见 git 历史), 本文件留作参数账本。

# ---- input ----------------------------------------------------------------
HF_DIR=/Users/fodelf/ds4-main/hf/DeepSeek-V4-Flash-Base   # original model (M1 holds all shards)
TEMPLATE_GGUF=/Users/fodelf/git/ds4-main/gguf/ds4flash-template.gguf
KEYWORDS="go"                 # one or more domain keywords, space separated

# ---- corpus harvest (per keyword) ------------------------------------------
TOP_REPOS=10                  # top-N starred repos per keyword
ISSUES_PER_REPO=50            # closed+open issues per repo (top by comments)
MAX_REPO_MB=80                # clone size guard per repo
BOOKS_DIR=corpus/books        # user-supplied legal texts (refactoring, CLRS, ...)
METHOD_DIR=corpus/method      # methodology docs (e.g. superpowers-style workflows)
CHUNK_TOKENS=512              # capture/训练切块
CORPUS_OUT=corpus/build       # merged, routed corpus output

# ---- difficulty routing (simple vs complex chains) --------------------------
ROUTE_SIMPLE_MAX_LINES=40     # snippet <= N lines -> simple chain (plain continuation)
ROUTE_COMPLEX_TEMPLATE=chain  # complex items get issue->analysis->patch chain format
SIMPLE_RATIO=0.6              # corpus mix ratio simple:complex

# ---- quantization + latent solve -------------------------------------------
EXPERT_BITS=go1b              # expert quant type (strict 1-bit)
GO_STATS=1                    # L_fix: Go-aware weighted scales at emit
RANK=64                       # z rank k (per-layer cap; energy rule may lower)
LAMBDA=1e-1                   # RRR ridge
LAM_C=0.2                     # co-firing C ridge
W_ALIGN=1.0                   # inverse-norm token reweight
FEAT=yhat                     # latent features (runtime binds routed_out)
NX=10240                      # train tokens per layer
HELDOUT_FRAC=0.17
SHALLOW_TRUST=24              # teacher-trajectory trusted depth; deeper layers
                              # are re-solved on the student trajectory (R2 EF)
EF_ROUNDS=1                   # error-feedback rounds (student traj -> re-solve)

# ---- cluster ----------------------------------------------------------------
M1=192.168.1.2
ROOT_M4=/Users/fodelf/git/ds4-main
ROOT_M1=/Users/fodelf/ds4-main
M4_LAYER_MAX=11               # M4 holds shards for L0-11 only (disk wall)
RSS_KILL_MB=9000              # per-process watchdog line on M1
PUMPS=2                       # chunk/layer-parallel pumps on M1 when it is free

# ---- output -----------------------------------------------------------------
OUT_GGUF=gguf/ds4-{kw}-1bit.gguf         # Θ_fix
OUT_CORR=gguf/ds4-{kw}-corr.gguf         # z sidecar (four-loss calibrated)
REPORT=fable5.md                          # verdict tables appended here
