<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1-bit DeepSeek Restore</title>
<style>
:root {
  --bg: #ffffff; --surface: #ffffff; --ink: #111; --ink2: #555; --ink3: #8a8a8a; --line: #e6e6e6; --grid: #efefef;
  --s1: #eb6834; --s2: #2a78d6; --s3: #1baf7a; --s4: #9a6bd6; --drop: #b8b8b8; --bad: #d64545; --chip: #f1f1f1;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1012; --surface: #17181b; --ink: #ededed; --ink2: #b0b0b0; --ink3: #7b7b7b; --line: #2a2b2f; --grid: #222327; --chip: #24252a; --drop: #5d5e63;
} }
:root[data-theme="dark"] { --bg: #0f1012; --surface: #17181b; --ink: #ededed; --ink2: #b0b0b0; --ink3: #7b7b7b; --line: #2a2b2f; --grid: #222327; --chip: #24252a; --drop: #5d5e63; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
.mono { font-family: var(--mono); }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { max-width: 1320px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 18px; min-height: 60px; flex-wrap: wrap; }
nav a { color: var(--ink2); text-decoration: none; padding: 18px 0 16px; margin-right: 22px; display: inline-block; border-bottom: 2px solid transparent; font-size: 16px; }
nav a.on { color: var(--ink); border-color: var(--ink); }
.spacer { flex: 1; }
.clk { text-align: right; line-height: 1.15; }
.clk small { display: block; font-size: 11px; letter-spacing: .08em; color: var(--ink3); text-transform: uppercase; }
.clk b { font: 500 17px var(--mono); }
.sep { width: 1px; height: 30px; background: var(--line); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: 13px var(--sans); }
.btn.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.conn { font-size: 12px; color: var(--ink3); display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--drop); }
.dot.live { background: var(--s3); box-shadow: 0 0 0 3px color-mix(in srgb, var(--s3) 25%, transparent); }
.dot.run { background: var(--s1); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
main { max-width: 1320px; margin: 0 auto; padding: 22px 16px 60px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 18px; overflow: hidden; }
.card > h3 { margin: 0; padding: 14px 20px 6px; font-size: 15px; font-weight: 600; }
.card > h3 span { color: var(--ink3); font-weight: 400; margin-left: 6px; }
.notices { padding: 0 20px 8px; }
.notices div { display: grid; grid-template-columns: 120px 1fr; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); }
.notices time { font: 13px var(--mono); color: var(--ink3); padding-top: 2px; }
.runhead { display: flex; align-items: center; gap: 28px; padding: 18px 22px; flex-wrap: wrap; }
.runhead .name { font: 600 18px var(--mono); display: flex; align-items: center; gap: 10px; }
.runhead .st { color: var(--ink3); font-size: 15px; }
.runhead .step { font: 600 22px var(--mono); }
.runhead .el b { font: 500 18px var(--mono); display: block; }
.runhead .el small, .runhead .ph small { font: 13px var(--mono); color: var(--ink3); }
.runhead .ph { font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--line); }   /* 9 格固定两排(5 + 4), 自动排会挤成一排 */
.stats > div { padding: 14px 20px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
.stats small { display: block; color: var(--ink2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats b { font: 600 24px var(--mono); display: block; white-space: nowrap; }
.stats i { font: 12px var(--mono); font-style: normal; display: block; white-space: nowrap; color: var(--ink3); }
.stats i em { font-style: normal; margin-right: 4px; }
.up { color: var(--s3); } .down { color: var(--bad); }
.phases { display: flex; gap: 6px; padding: 0 22px 16px; flex-wrap: wrap; }
.phases span { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--chip); color: var(--ink3); }
.phases span.done { color: var(--ink2); }
.phases span.cur { background: var(--s1); color: #fff; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 18px; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 6px; position: relative; min-width: 0; }
.chart .hd { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.chart .ti { font: 14px var(--mono); color: var(--ink2); }
.chart .ti b { color: var(--ink); font-weight: 500; }
.chart .sub { font-size: 12px; color: var(--ink3); }
.chart .lv { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 6px; font: 12px var(--mono); color: var(--ink2); }
.chart .lv > span { white-space: nowrap; }
.chart .lv b { color: var(--ink); font-weight: 600; }
.chart svg { width: 100%; height: 210px; display: block; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: 12px var(--mono); box-shadow: 0 4px 14px rgba(0,0,0,.08); display: none; z-index: 3; white-space: nowrap; }
.tick { font: 11px var(--mono); fill: var(--ink3); }
.ctl { display: flex; align-items: center; gap: 14px; margin: 4px 0 16px; flex-wrap: wrap; font-size: 14px; color: var(--ink2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--ink2); padding: 5px 12px; cursor: pointer; font: 14px var(--sans); }
.seg button.on { background: var(--ink); color: var(--surface); }
.lg { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; font-size: 13px; }
.lg i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.cmpkey { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 2px 20px 12px; font-size: 13px; color: var(--ink2); }
.cmpkey i, .mr .tr b { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.cmpkey i { margin-right: 6px; }
.cmpkey small { color: var(--ink3); margin-left: 4px; }
.cmpg { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 18px; margin-bottom: 18px; }   /* 与 .grid3 判决尺卡片同宽 */
.cmpg .cg { grid-column: 1 / -1; font-size: 13px; color: var(--ink2); margin: 6px 0 -6px; }
.mt { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 10px; min-width: 0; }
.mt h4 { margin: 0 0 4px; font-size: 13px; font-weight: 500; color: var(--ink); }
.mt h4 small { color: var(--ink3); font-weight: 400; margin-left: 6px; }
.mt p { margin: 2px 0 0; font-size: 11px; color: var(--ink3); }
.mr { display: grid; grid-template-columns: 76px 1fr 88px; align-items: center; gap: 10px; height: 22px; font: 12px var(--mono); }
.mr .nm { color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mr .tr { position: relative; height: 1px; background: var(--line); }
.mr .tr b { position: absolute; top: 0; transform: translate(-50%, -50%); }
.mr .v { text-align: right; white-space: nowrap; color: var(--ink2); }
.mr .v small { color: var(--ink3); font-size: 10px; }
.mr.best .v { color: var(--ink); font-weight: 700; }
.mr.ours .nm { color: var(--s1); }
.notes { padding: 8px 20px 16px; color: var(--ink3); font-size: 13px; }
.notes p { margin: 6px 0; }
.feed { max-height: 520px; overflow-y: auto; padding: 0 20px 10px; }
.feed div { display: grid; grid-template-columns: 120px 1fr; gap: 16px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.feed time { font: 13px var(--mono); color: var(--ink3); }
.feed .tag { font: 12px var(--mono); color: var(--ink3); margin-left: 8px; }
.about .abody { padding: 2px 20px 12px; max-width: 900px; }
.about .abody > :first-child { margin-top: 4px; }
.about ol, .about ul { padding-left: 22px; }
.about li { margin: 6px 0; }
.about p, .about li { color: var(--ink2); }
.about code { font: 13px var(--mono); background: var(--chip); padding: 1px 5px; border-radius: 4px; }
.hide { display: none !important; }
h1.hero { font-size: 26px; font-weight: 650; margin: 4px 0 6px; letter-spacing: -.01em; }
.links { margin: 0 0 18px; font-size: 14px; color: var(--ink3); display: flex; gap: 16px; flex-wrap: wrap; }
.links a { color: var(--ink2); text-decoration: none; border-bottom: 1px solid var(--line); }
.links a:hover { color: var(--ink); border-color: var(--ink); }
@media (max-width: 760px) { h1.hero { font-size: 21px; } }
.warm { padding: 60px 0; text-align: center; color: var(--ink3); }
@media (max-width: 760px) {
  .clk.tz { display: none; }
  nav a { margin-right: 14px; }
  .grid3 { grid-template-columns: 1fr; }
  .notices div, .feed div { grid-template-columns: 1fr; gap: 2px; }
  .runhead { gap: 14px; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }   /* 9 格 = 3×3 */
  .stats > div { padding: 10px 12px; }
  .stats small { font-size: 12px; }
  .stats b { font-size: 18px; }
  .stats i { font-size: 11px; white-space: normal; }   /* 窄屏一格 ~95 px, "▼0.0137 较起点"放不下就折行, 不溢出 */
  .runhead { padding: 14px 16px; }
  .runhead .name { font-size: 15px; }
  .runhead .step { font-size: 18px; }
  .phases { padding: 0 16px 12px; align-items: center; }
  .phases span:not(.cur) { font-size: 0; padding: 0; width: 22px; height: 6px; }   /* 窄屏六个阶段名要占三行: 只留当前这段的字, 其余缩成进度格 */
  .phases span.done { background: var(--ink3); }
  .cmpkey { padding-left: 16px; padding-right: 16px; }
  .card > h3 { padding: 12px 16px 6px; }
  .notes { padding: 6px 16px 14px; }
  .about .abody { padding: 2px 16px 10px; }
  .clk.vis { display: none; }
}
</style>
</head>

<script>
'use strict';
const L = {
  zh: {
    hero: '自学习还原 1 bit 的 DeepSeek 量化模型', site: '项目网站', visits: '访客 · 浏览 · 在看', tab_overview: '总览', tab_metrics: '指标', tab_about: '说明', total_cost: 'API 总花费', beijing: '北京', la: '洛杉矶', london: '伦敦',

try { lang = localStorage.getItem('rl_lang'); } catch (e) { /* 隐私窗口读不了: 用缺省 */ }
if (lang !== 'zh' && lang !== 'en') lang = 'en';   // 缺省英文(11-04 用户定), 不看浏览器语言; 点过切换按钮才记住选择
const T = (k, o) => { let s = L[lang][k] ?? k; if (o) for (const a in o) s = s.replaceAll('{' + a + '}', o[a]); return s; };

/* ---------- 格式 ---------- */
const BJ = 8 * 3600;
const pad = n => String(n).padStart(2, '0');
function bj(t, sec) { const d = new Date((t + BJ) * 1000); return `${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}` + (sec ? ':' + pad(d.getUTCSeconds()) : ''); }
function dur(s) { s = Math.max(0, Math.floor(s)); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (d ? d + 'd ' : '') + `${pad(h)}:${pad(m)}:${pad(x)}`; }
function big(n) { if (n == null) return '—'; const a = Math.abs(n); return a >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : a >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : a >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n)); }
function fx(v, d) { return v == null ? '—' : (+v).toFixed(d); }
const nz = v => v != null && isFinite(v);

/* ---------- 派生数据 ---------- */
function derive() {
  const R = D.rounds, base = D.base || {};
  let best = { same: base.same, kld: base.kld, smin: base.smin, wkld: base.wkld, wsame: base.wsame, tag: base.tag };
  const bestSeries = [];
  for (const r of R) { if (r.verdict === 'relay') best = r; if (r.end) bestSeries.push({ n: r.n, t: r.end, same: best.same, kld: best.kld, smin: best.smin, wkld: best.wkld, wsame: best.wsame }); }
  let cost = 0, tok = 0, pos = 0, nq = 0, hours = 0, relay = 0, done = 0;
  for (const r of R) {
    cost += r.cny || 0; tok += (r.hit || 0) + (r.miss || 0) + (r.out || 0); pos += r.rows || 0; nq += r.nq || 0;
    if (r.start && r.end && r.end > r.start) hours += (r.end - r.start) / 3600;
    if (r.verdict) done++; if (r.verdict === 'relay') relay++;
  }
  return { best, bestSeries, cost, tok, pos, nq, hours, relay, done };
}

/* ---------- 画图(纯 SVG) ---------- */
const NS = 'http://www.w3.org/2000/svg';
function el(p, tag, a, txt) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; p.appendChild(e); return e; }
function niceTicks(lo, hi, n) {
  const span = hi - lo || Math.abs(hi) || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), r = step0 / mag;
  const step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag, out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-6; v += step) out.push(+v.toPrecision(10));
  return out;
}
function ema(pts, a) { if (!a) return pts; let s = null; return pts.map(([x, y]) => { s = s == null ? y : a * s + (1 - a) * y; return [x, s]; }); }
function fmtV(v) { const a = Math.abs(v); return a >= 1000 ? big(v) : a >= 10 ? v.toFixed(2) : a >= 1 ? v.toFixed(3) : a >= 0.01 ? v.toFixed(4) : v.toPrecision(3); }

/* spec: { title, sub, series: [{ name, color, pts: [[x,y,extra]], dots, line, dotColor(p), step }], refs: [{ y, label, color }], xfmt, lowerBetter } */
function chart(host, spec) {
  const box = document.createElement('div'); box.className = 'chart'; host.appendChild(box);
  const hd = document.createElement('div'); hd.className = 'hd'; box.appendChild(hd);
  const [pfx, last] = spec.title.includes('/') ? [spec.title.slice(0, spec.title.lastIndexOf('/') + 1), spec.title.slice(spec.title.lastIndexOf('/') + 1)] : ['', spec.title];
  hd.innerHTML = `<div><div class="ti">${pfx}<b>${last}</b></div>${spec.sub ? `<div class="sub">${spec.sub}</div>` : ''}</div>`;
  // 每条线的最新值横排在标题下面(带名字), 原来竖叠在右上角, 两条线的数挤成一团还看不出哪个是哪个
  const lv = document.createElement('div'); lv.className = 'lv'; box.appendChild(lv);
  for (const s of spec.series) {
    const p = s.pts.filter(q => nz(q[1])); if (!p.length || s.noLegend) continue;
    const v = p[p.length - 1][1], pv = p.length > 1 ? p[p.length - 2][1] : null;
    const d = pv == null ? '' : v - pv, good = d === '' ? '' : ((d < 0) === !!spec.lowerBetter ? 'up' : 'down');
    lv.insertAdjacentHTML('beforeend', `<span><span style="color:${s.color}">●</span> ${s.name} <b>${fmtV(v)}</b>${d === '' || d === 0 ? '' : ` <span class="${good}">${d > 0 ? '▲' : '▼'}${+Math.abs(d).toPrecision(2)}</span>`}</span>`);
  }
  const svg = el(box, 'svg', { viewBox: '0 0 400 210', preserveAspectRatio: 'none' });
  const tip = document.createElement('div'); tip.className = 'tip'; box.appendChild(tip);
  const all = spec.series.flatMap(s => s.pts.filter(p => nz(p[1]) && nz(p[0])));
  if (!all.length) { el(svg, 'text', { x: 200, y: 110, 'text-anchor': 'middle', class: 'tick' }, '—'); return; }
  const log = UI.y === 'log' && all.every(p => p[1] > 0);
  const tf = v => log ? Math.log10(v) : v;
  let xs = all.map(p => p[0]), ys = all.map(p => tf(p[1]));
  for (const r of spec.refs || []) ys.push(tf(r.y));
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (x1 === x0) { x0 -= 1; x1 += 1; }
  const pad_ = (y1 - y0) * 0.08 || Math.abs(y1) * 0.05 || 1; y0 -= pad_; y1 += pad_;
  const ML = 44, MR = 8, MT = 8, MB = 22, W = 400, H = 210;
  const X = x => ML + (x - x0) / (x1 - x0) * (W - ML - MR), Y = y => MT + (y1 - tf(y)) / (y1 - y0) * (H - MT - MB);
  const Yt = y => MT + (y1 - y) / (y1 - y0) * (H - MT - MB);
  for (const t of niceTicks(y0, y1, 4)) {
    el(svg, 'line', { x1: ML, x2: W - MR, y1: Yt(t), y2: Yt(t), stroke: 'var(--grid)', 'vector-effect': 'non-scaling-stroke' });
    el(svg, 'text', { x: ML - 6, y: Yt(t) + 3.5, 'text-anchor': 'end', class: 'tick' }, log ? fmtV(Math.pow(10, t)) : fmtV(t));
  }
  const xt = UI.x === 'time' && spec.timeX !== false ? niceTimeTicks(x0, x1) : niceTicks(x0, x1, 5).filter(v => Number.isInteger(v));
  for (const t of xt) el(svg, 'text', { x: X(t), y: H - 5, 'text-anchor': 'middle', class: 'tick' }, (spec.xfmt || String)(t));
  for (const r of spec.refs || []) {
    el(svg, 'line', { x1: ML, x2: W - MR, y1: Y(r.y), y2: Y(r.y), stroke: r.color, 'stroke-dasharray': '4 3', 'vector-effect': 'non-scaling-stroke', opacity: .8 });
    el(svg, 'text', { x: r.left ? ML + 4 : W - MR - 2, y: Y(r.y) - 3, 'text-anchor': r.left ? 'start' : 'end', class: 'tick', fill: r.color }, r.label);   // 起点放左, 别家放右: 85.16 与 85.1 两条线挨着, 标签别叠
  }
  for (const s of spec.series) {
    const p = s.pts.filter(q => nz(q[1]) && nz(q[0]));
    if (s.line !== false && p.length > 1) {
      let d = '';
      p.forEach((q, i) => { const px = X(q[0]), py = Y(q[1]); d += i ? (s.step ? `H${px}V${py}` : `L${px},${py}`) : `M${px},${py}`; });
      el(svg, 'path', { d, fill: 'none', stroke: s.color, 'stroke-width': s.width || 1.6, 'vector-effect': 'non-scaling-stroke', opacity: s.opacity || 1 });
    }
    if (s.dots) for (const q of p) el(svg, 'circle', { cx: X(q[0]), cy: Y(q[1]), r: 3, fill: s.dotColor ? s.dotColor(q) : s.color, stroke: 'var(--surface)', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' });
  }
  // 悬停: 每条线取 x 最近的点
  const cross = el(svg, 'line', { y1: MT, y2: H - MB, stroke: 'var(--ink3)', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke', opacity: 0 });
  svg.addEventListener('mousemove', ev => {
    const bb = svg.getBoundingClientRect(), xv = x0 + ((ev.clientX - bb.left) / bb.width * W - ML) / (W - ML - MR) * (x1 - x0);
    let rows = [], xs_ = null;
    for (const s of spec.series) {
      const p = s.pts.filter(q => nz(q[1]) && nz(q[0])); if (!p.length) continue;
      let b = p[0]; for (const q of p) if (Math.abs(q[0] - xv) < Math.abs(b[0] - xv)) b = q;
      if (xs_ == null) xs_ = b[0];
      rows.push(`<span style="color:${s.color}">●</span> ${s.name}: ${fmtV(b[1])}${b[2] ? ' · ' + b[2] : ''}`);
    }
    if (xs_ == null) return;
    cross.setAttribute('x1', X(xs_)); cross.setAttribute('x2', X(xs_)); cross.setAttribute('opacity', .5);
    tip.innerHTML = `<div style="color:var(--ink3)">${(spec.xfmt || String)(xs_)}</div>` + rows.join('<br>');
    tip.style.display = 'block';
    const bx = box.getBoundingClientRect(), left = ev.clientX - bx.left + 12;
    tip.style.left = Math.min(left, bx.width - tip.offsetWidth - 6) + 'px'; tip.style.top = (ev.clientY - bx.top + 12) + 'px';
  });
  svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; cross.setAttribute('opacity', 0); });
}
function niceTimeTicks(a, b) {
  const span = b - a, steps = [600, 1800, 3600, 7200, 3 * 3600, 6 * 3600, 12 * 3600, 86400, 2 * 86400];
  const st = steps.find(s => span / s <= 5) || 7 * 86400, out = [];
  for (let t = Math.ceil((a + BJ) / st) * st - BJ; t <= b; t += st) out.push(t);
  return out;
}

  document.getElementById('runstart').textContent = D.camp_start ? T('started', { t: bj(D.camp_start) }) : '';
  const ph = document.getElementById('runph'), phs = document.getElementById('phases');

    ph.innerHTML = live.step ? T('ph_now', { p, s: live.step, t: dur(live.t || 0) }) + (live.loss != null ? `<br><small>loss ${fmtV(live.loss)}</small>` : '')
                             : T('ph_now0', { p, t: live.since ? dur(now - live.since) : '—' });
    const order = ['data', 'anchor', 'load', 'eval0', 'train', 'judge'], k = order.indexOf(live.phase);
    phs.innerHTML = order.map((o, i) => `<span class="${i < k ? 'done' : i === k ? 'cur' : ''}">${T('ph_' + o)}</span>`).join('');
  } else { ph.textContent = run ? '' : T('not_running'); phs.innerHTML = ''; }

  const delta = (v, v0, d, lowerBetter) => v == null || v0 == null ? '' : `<i><em class="${(v - v0 < 0) === lowerBetter ? 'up' : 'down'}">${v - v0 >= 0 ? '▲' : '▼'}${Math.abs(v - v0).toFixed(d)}</em>${T('vs_start')}</i>`;
  const cells = [
    [T('s_same'), fx(best.same, 2) + '%', delta(best.same, b.same, 2, false)],
    [T('s_kld'), fx(best.kld, 5), delta(best.kld, b.kld, 4, true)],
    [T('s_smin'), fx(best.smin, 4), delta(best.smin, b.smin, 3, false)],
    [T('s_cost'), '¥' + g.cost.toFixed(2), ''],
    [T('s_api_tok'), big(g.tok), ''],
    [T('s_tok'), big(g.pos), ''],
    [T('s_q'), big(g.nq), ''],
    [T('s_hours'), g.hours.toFixed(1) + ' h', ''],
    [T('s_rounds'), `${g.relay} / ${g.done}`, ''],
  ];
  document.getElementById('stats').innerHTML = cells.map(c => `<div><small title="${c[0]}">${c[0]}</small><b>${c[1]}</b>${c[2]}</div>`).join('');
  document.getElementById('hdcost').textContent = '¥' + g.cost.toFixed(2);
}

<h2>What this is</h2>
<p>DS4 is a 1-bit quantization of DeepSeek V4.1 Flash (510 GB original): 113.6 GB, small enough to run the whole model on one 128 GB machine (NVIDIA DGX Spark / GB10). Quantization pulls the model’s output distribution away from the original; this page streams the self-learning loop that <b>pulls it back</b>.</p>
<h2>What one round does (≤ 1 hour)</h2>

<li><b>Data</b>: the official DeepSeek API writes brand-new questions in 6 families (code, math, data, writing, illustration, general). Each passes a leak check against the Unsloth benchmark items (a hit drops the item), then the API answers them and returns the top-20 candidate probabilities for every token. It also writes raw source-code continuations in 10 languages.</li>
<li><b>FP anchor</b>: this round’s code goes through a reference forward of the original model, giving the original’s full distribution at every position — the teacher.</li>
<li><b>Train</b>: the live model is stopped, and a low-rank correction (“③”, ~100 MB) next to the quantized model is trained so its output distribution moves toward the teacher.</li>
<li><b>Judge</b>: four rulers re-measure. Passing the gate “relays” it into the new best; otherwise it is discarded and the next round starts from the same place.</li>

<li><b>Σmin</b>: average overlap of the two distributions per position (Σ min(p, q)); 1 = full overlap.</li>
<li><b>judge</b> = 15,360 never-trained code tokens across 30 languages; <b>wt2</b> = 512 tokens of WikiText-2 English encyclopedia text, reported but not gated (it guards against fixing code by breaking general ability).</li>

  renderRun(g);
  if (UI.tab === 'overview') { renderLive(); renderCmp(g); renderBench(g); renderFeed(); }
  else if (UI.tab === 'metrics') renderMetrics(g);
  else if (UI.tab === 'notices') renderNotices();
  else renderAbout();
  clocks();
}

/* ---------- 交互 ---------- */
function setTab() { const h = location.hash.slice(1); UI.tab = ['overview', 'metrics', 'about', 'notices'].includes(h) ? h : 'overview'; render(); }
window.addEventListener('hashchange', setTab);
document.getElementById('langbtn').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; try { localStorage.setItem('rl_lang', lang); } catch (e) {} applyI18n(); render(); conn(); };
document.getElementById('themebtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; try { localStorage.setItem('rl_theme', nx); } catch (e) {}
};
try { const th = localStorage.getItem('rl_theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
for (const [id, key] of [['xseg', 'x'], ['yseg', 'y']]) document.getElementById(id).addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  UI[key] = b.dataset[key]; document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle('on', x === b)); render();
});
document.getElementById('smooth').addEventListener('input', ev => { UI.smooth = +ev.target.value; applyI18n(); render(); });

applyI18n(); setTab(); conn();
setInterval(clocks, 1000);
loadCmp(); poll();
</script>
</body>
</html>
